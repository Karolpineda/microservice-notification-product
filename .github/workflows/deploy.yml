name: CI/CD to EC2

on:
  push:
    branches: [ "qa" ]

jobs:
  build-and-push-image:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v3

      - name: Login to Docker Hub
        run: docker login -u ${{ secrets.DOCKER_USERNAME }} -p ${{ secrets.DOCKER_PASSWORD }}

      - name: Build Docker Image
        run: docker build -t karolpineda/microservice-notification-product:latest .

      - name: Push Docker Image
        run: docker push karolpineda/microservice-notification-product:latest

  deploy-to-ec2:
    needs: build-and-push-image
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_PRIVATE_KEY }}
          script: |
            # 1) Bajar la imagen de Docker Hub
            docker pull karolpineda/microservice-notification-product:latest

            # 2) Detener y eliminar contenedor previo
            docker stop notification_product_container || true
            docker rm notification_product_container || true

            # 3) Generar .env con secretos
            echo "EMAIL_SERVICE=${{ secrets.EMAIL_SERVICE }}" > .env
            echo "EMAIL_PORT=${{ secrets.EMAIL_PORT }}" >> .env
            echo "EMAIL_SECURE=${{ secrets.EMAIL_SECURE }}" >> .env
            echo "EMAIL_USER=${{ secrets.EMAIL_USER }}" >> .env
            echo "EMAIL_PASS=${{ secrets.EMAIL_PASS }}" >> .env
            echo "EMAIL_FROM=${{ secrets.EMAIL_FROM }}" >> .env
            echo "NOTIFICATION_EMAIL=${{ secrets.NOTIFICATION_EMAIL }}" >> .env
            echo "PORT=${{ secrets.PORT }}" >> .env
            # Agrega más variables si requieres

            # 4) Correr contenedor usando ese .env
            docker run -d --name notification_product_container \
              --env-file .env \
              -p 8082:8082 \
              karolpineda/microservice-notification-product:latest
